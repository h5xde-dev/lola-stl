<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Прототип магазина авторских STL-моделей кашпо и боксов для 3D-печати.">
<meta name="theme-color" content="#fdf7f9">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>lola.stl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: каталог как стол принтера — каждая карточка это печатная платформа с сеткой; цены показаны линейкой тарифов; один липкий заголовок.
   Стиль канала: розовые и малиновые отпечатки среди листьев — светлый румяный фон, орхидейно-розовый акцент, зелёный лист для подарков и акции. Только светлая тема. */
:root {
  color-scheme: light;
  --bg: #fdf7f9;
  --surface: #ffffff;
  --soft: #f7eaf0;
  --grid: rgba(201, 48, 118, .09);
  --ink: #2b1a2c;
  --muted: #7d6a7c;
  --line: #f0dde6;
  --accent: #c93076;
  --accent-ink: #ffffff;
  --accent-soft: #fde3ee;
  --promo: #5fb15a;
  --promo-ink: #ffffff;
  --promo-soft: #e8f6e2;
  --danger: #c0392b;
  --shadow: 0 1px 2px rgba(120, 40, 80, .05), 0 10px 28px rgba(120, 40, 80, .08);
  --f-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

/* prototype bar */
.proto { border-bottom: 1px dashed var(--line); background: var(--surface); font-size: 13px; }
.proto-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; }
.proto-label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 2px 8px; border-radius: 99px; }
.proto-note { color: var(--muted); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track { width: 36px; height: 20px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; }
.track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + .track { background: var(--promo); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 4px 12px; border-radius: 99px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.link-btn { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; font-size: 13px; }

/* header */
.site-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.head-in { display: flex; align-items: center; gap: 24px; padding-block: 12px; }
.logo { font-family: var(--f-display); font-weight: 700; font-size: 22px; text-decoration: none; letter-spacing: -.02em; }
.logo span { font-family: var(--f-mono); font-weight: 500; font-size: 17px; color: var(--accent); letter-spacing: 0; }
.head-in nav { display: flex; gap: 18px; flex: 1; min-width: 0; }
.head-in nav a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; }
.head-in nav a[aria-current="page"] { color: var(--ink); }
.cart-btn { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 99px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.cart-btn .count { background: var(--accent); color: var(--accent-ink); border-radius: 99px; min-width: 22px; height: 22px; display: inline-grid; place-items: center; font-size: 12px; padding: 0 6px; }
@media (max-width: 560px) { .head-in nav { display: none; } .head-in { justify-content: space-between; } }

/* telegram frame */
.tg-only { display: none; }
.tg .site-only { display: none !important; }
.tg .stage { padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tg .shell { max-width: 400px; margin: 0 auto; border: 1px solid var(--line); border-radius: 28px; overflow: clip; background: var(--bg); box-shadow: var(--shadow); }
.tg .tg-head { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
.tg-head .tg-x { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; padding: 4px; }
.tg-title { text-align: center; line-height: 1.2; }
.tg-title b { display: block; font-size: 15px; }
.tg-title small { color: var(--muted); font-size: 12px; }
.tg .tg-main { display: block; position: sticky; bottom: 0; padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); z-index: 5; }
.tg .tg-main[hidden] { display: none !important; }
.tg .wrap { padding-left: 14px; padding-right: 14px; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.block { width: 100%; padding-block: 13px; font-size: 15px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* hero + tiers */
.hero { padding-block: 36px 20px; display: grid; gap: 14px; }
.hero h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 4.4vw, 44px); line-height: 1.08; letter-spacing: -.025em; max-width: 18ch; }
.hero p { color: var(--muted); font-size: 17px; max-width: 52ch; margin: 0; }
.tg .hero { padding-block: 18px 8px; }
.tg .hero h1 { font-size: 22px; }
.tg .hero p { font-size: 14px; }

.tiers-box { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
.tiers-box.promo { border-color: var(--promo); background: var(--promo-soft); }
.tiers-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: baseline; }
.tiers-head b { font-size: 15px; }
.promo-pill { background: var(--promo); color: var(--promo-ink); font-weight: 700; font-size: 12px; padding: 3px 10px; border-radius: 99px; letter-spacing: .02em; }
.tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tier { background: var(--surface); padding: 10px 12px; display: grid; gap: 2px; }
.tiers-box.promo .tier { background: color-mix(in srgb, var(--surface) 70%, var(--promo-soft)); }
.tier-n { font-family: var(--f-mono); font-size: 18px; font-weight: 500; }
.tier-n .g { color: var(--accent); }
.tier-sub { color: var(--muted); font-size: 12px; }
.tier-p { font-weight: 700; font-variant-numeric: tabular-nums; }
.tiers-foot { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.tg .tiers { grid-template-columns: repeat(2, 1fr); }

/* filters */
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 22px 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-weight: 600; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font: inherit; color: var(--ink); width: 220px; max-width: 100%; }
.tg .search { width: 100%; }
.count-note { color: var(--muted); font-size: 13px; }

/* grid + cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; padding-bottom: 12px; }
.tg .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.bed { position: relative; display: block; width: 100%; aspect-ratio: 1; border: 0; padding: 0; cursor: pointer; background-color: var(--soft); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; background-position: center; }
.bed canvas { width: 100%; height: 100%; display: block; }
.badges { position: absolute; top: 8px; left: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.badge.new { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.badge.big { font-family: var(--f-mono); font-weight: 500; }
.card-b { padding: 12px; display: grid; gap: 6px; flex: 1; align-content: start; }
.card-t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card-t h3 { font-size: 15px; font-weight: 700; min-width: 0; }
.kind { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; white-space: nowrap; }
.meta { margin: 0; font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .add { margin-top: 4px; width: 100%; }
.add.in { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.add.gift { border-color: var(--promo); background: var(--promo-soft); }
.tg .card-b { padding: 10px; }
.tg .card-t { flex-direction: column; gap: 0; }
.tg .meta { font-size: 11px; }

.empty { padding: 40px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }

/* how */
.how { padding-block: 36px 48px; display: grid; gap: 16px; }
.how h2 { font-family: var(--f-display); font-size: 22px; font-weight: 500; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; list-style: none; padding: 0; margin: 0; counter-reset: s; }
.steps li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; counter-increment: s; display: grid; gap: 4px; }
.steps li::before { content: counter(s); font-family: var(--f-mono); color: var(--accent); font-size: 13px; }
.steps b { font-size: 15px; }
.steps span { color: var(--muted); font-size: 14px; }

/* cart */
.page { padding-block: 28px 48px; display: grid; gap: 20px; }
.page h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 3.4vw, 32px); letter-spacing: -.02em; }
.tg .page { padding-block: 16px 24px; }
.tg .page h1 { font-size: 22px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
.tg .cols, .cols.one { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.group { display: grid; gap: 8px; }
.group h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px 8px 8px; }
.row .bed { width: 56px; height: 56px; border-radius: 8px; overflow: hidden; background-size: 10px 10px; }
.row-t { min-width: 0; display: grid; gap: 2px; }
.row-t b { font-size: 14px; }
.row-end { display: flex; align-items: center; gap: 8px; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.gift { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.x { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px 6px; font-size: 13px; text-decoration: underline; }
.tg .row-end { flex-direction: column; align-items: flex-end; gap: 2px; }

.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); }
.tg .summary { position: static; }
.sum-line { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.sum-line span:first-child { color: var(--muted); }
.sum-line .v { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sum-sub { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-top: -8px; }
.sum-total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); padding-top: 12px; }
.sum-total b { font-family: var(--f-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.save { color: var(--accent); font-weight: 700; font-size: 13px; }
.hint { border-radius: 10px; padding: 10px 12px; font-size: 13px; background: var(--accent-soft); display: grid; gap: 6px; }
.hint.promo { background: var(--promo-soft); }
.hint a { font-weight: 700; color: var(--accent); }
.hint.warn { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin: 0; }

/* checkout */
.form { display: grid; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: 14px; }
.field input[type="email"] { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 11px 12px; font: inherit; width: 100%; }
.field .err { color: var(--danger); font-size: 13px; }
.pay-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.pay-opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; }
.pay-opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.pay-opt small { display: block; color: var(--muted); font-size: 12px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.check input { margin-top: 4px; }
.idnote { display: flex; gap: 10px; align-items: flex-start; background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--muted); }

.paywall { position: fixed; inset: 0; z-index: 30; background: rgba(60, 20, 45, .4); display: grid; place-items: center; padding: 16px; }
.paycard { background: var(--surface); color: var(--ink); border-radius: 18px; width: min(380px, 100%); padding: 22px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.paycard .bank { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.paycard b.amt { font-family: var(--f-display); font-size: 30px; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* purchases */
.order { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.order.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.order-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: center; }
.order-h b { font-family: var(--f-mono); font-weight: 500; }
.order-h .meta { margin: 0; }
.files { display: grid; }
.file { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.file:last-child { border-bottom: 0; }
.file .bed { width: 44px; height: 44px; border-radius: 8px; overflow: hidden; background-size: 8px 8px; }
.order-f { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--soft); font-size: 13px; color: var(--muted); }
.tg .file { grid-template-columns: 44px minmax(0, 1fr); }
.tg .file .btn { grid-column: 2; justify-self: start; }

/* footer */
.site-foot { border-top: 1px solid var(--line); padding-block: 22px; color: var(--muted); font-size: 13px; }
.foot-in { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }

/* dialog */
dialog { border: 0; padding: 0; border-radius: 20px; background: var(--surface); color: var(--ink); width: min(820px, calc(100% - 32px)); max-height: calc(100% - 32px); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(60, 20, 45, .35); }
.dlg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); position: relative; }
.dlg .bed { cursor: default; }
.dlg-b { padding: 24px; display: grid; gap: 12px; align-content: start; }
.dlg-b h2 { font-family: var(--f-display); font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.dlg-b p { margin: 0; color: var(--muted); }
.specs { margin: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.specs div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.specs dt { color: var(--muted); }
.specs dd { margin: 0; font-family: var(--f-mono); font-size: 13px; }
.dlg-x { position: absolute; top: 10px; right: 10px; z-index: 2; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1; }
@media (max-width: 640px) { .dlg { grid-template-columns: minmax(0, 1fr); } .dlg-b { padding: 18px; } }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; width: max-content; max-width: calc(100% - 32px); transition: opacity .2s, transform .2s; z-index: 40; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* shared */
.bed img { width: 100%; height: 100%; object-fit: cover; display: block; }
.err { color: var(--danger); font-size: 13px; }

/* admin */
.is-admin .site-only, .is-admin .tg-only { display: none !important; }
.adm-top { border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.adm-top-in { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.adm-tag { font-family: var(--f-mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 2px 8px; margin-right: auto; }
.adm-top .btn { text-decoration: none; }
.adm { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; padding-block: 24px 56px; align-items: start; }
.adm-nav { display: grid; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); }

<script>
(function () {
  "use strict";

  // ---------- data ----------
  const BASE_MODELS = [
    { id: "m01", name: "Твист-6", cat: "plant", n: 6, twist: 1.3, prof: "cone", color: "#e7a3b3", h: .62, r: .25, mb: 86, dims: "120 × 120 × 118 мм", print: "режим вазы, сопло 0,6 мм", isNew: true, desc: "Шестигранное кашпо с закруткой на треть оборота. Печатается одной стенкой, без поддержек." },
    { id: "m02", name: "Волна", cat: "plant", n: 18, round: true, prof: "wave", color: "#8fb8de", h: .6, r: .26, mb: 64, dims: "110 × 110 × 120 мм", print: "сопло 0,4 мм, слой 0,2 мм", desc: "Мягкий волнистый профиль с тонкими рёбрами. Подходит для суккулентов." },
    { id: "m03", name: "Соты", cat: "plant", n: 6, twist: 0, phase: .5, prof: "cyl", color: "#d9b54a", h: .55, r: .27, mb: 142, dims: "130 × 115 × 105 мм", print: "сопло 0,4 мм, слой 0,2 мм", desc: "Ровный шестигранник с текстурой сот по стенке. Хорошо собирается в группу." },
    { id: "m04", name: "Капля", cat: "plant", n: 0, round: true, prof: "bulb", color: "#b8a6e8", h: .64, r: .24, mb: 38, dims: "100 × 100 × 125 мм", print: "режим вазы, сопло 0,6 мм", desc: "Округлое кашпо с сужением к верху. Минимум деталей, быстро печатается." },
    { id: "m05", name: "Ярус", cat: "plant", n: 8, twist: .4, prof: "hour", color: "#4f9e9a", h: .6, r: .27, mb: 118, dims: "125 × 125 × 120 мм", print: "сопло 0,4 мм, слой 0,16 мм", desc: "Восьмигранник с талией и лёгкой закруткой." },
    { id: "m06", name: "Ребро", cat: "plant", n: 16, round: true, prof: "cone", color: "#ebe5db", h: .6, r: .26, mb: 54, dims: "115 × 115 × 115 мм", print: "сопло 0,4 мм, слой 0,2 мм", desc: "Конус с вертикальными рёбрами. Смотрится как керамика." },
    { id: "m07", name: "Лотос", cat: "plant", n: 10, twist: .9, prof: "bowl", color: "#b8417f", h: .48, r: .3, mb: 196, dims: "160 × 160 × 95 мм", print: "сопло 0,4 мм, слой 0,2 мм", isNew: true, desc: "Широкая низкая чаша с лепестковыми гранями. Для композиций и мха." },
    { id: "m08", name: "Призма", cat: "plant", n: 3, twist: 2.1, prof: "cyl", color: "#3b4048", h: .6, r: .26, mb: 72, dims: "120 × 110 × 120 мм", print: "режим вазы, сопло 0,6 мм", desc: "Треугольник, закрученный на 120°. Хорошо смотрится в тёмном пластике." },
    { id: "m09", name: "Песочные часы", cat: "plant", n: 0, round: true, prof: "hour", color: "#a7c49a", h: .62, r: .25, mb: 47, dims: "110 × 110 × 125 мм", print: "режим вазы, сопло 0,6 мм", desc: "Круглое кашпо с талией посередине." },
    { id: "m10", name: "Кора", cat: "plant", n: 12, twist: .25, prof: "bulb", color: "#9c7b5b", h: .64, r: .26, mb: 233, dims: "140 × 140 × 150 мм", print: "сопло 0,4 мм, слой 0,12 мм", desc: "Фактура древесной коры. Детализированная модель, поэтому файл крупный." },
    { id: "m11", name: "Спираль-8", cat: "plant", n: 8, twist: 3.2, prof: "cone", color: "#f0c8d4", h: .62, r: .25, mb: 104, dims: "120 × 120 × 125 мм", print: "режим вазы, сопло 0,6 мм", isNew: true, desc: "Восемь граней с полным оборотом спирали." },
    { id: "m12", name: "Минимал", cat: "plant", n: 0, round: true, prof: "cyl", color: "#c9d3dc", h: .5, r: .25, mb: 12, dims: "100 × 100 × 100 мм", print: "режим вазы, сопло 0,4 мм", desc: "Простой цилиндр с поддоном. Основа для любых интерьеров." },
    { id: "m13", name: "Гофре", cat: "plant", n: 24, round: true, prof: "wave", color: "#e2b07a", h: .58, r: .27, mb: 88, dims: "130 × 130 × 115 мм", print: "сопло 0,4 мм, слой 0,2 мм", desc: "Частые рёбра и волна по высоте." },
    { id: "m14", name: "Бутон", cat: "plant", n: 5, twist: 1, prof: "bulb", color: "#c56a8a", h: .62, r: .25, mb: 61, dims: "115 × 115 × 125 мм", print: "режим вазы, сопло 0,6 мм", desc: "Пятигранник, собранный к горлышку, как нераскрывшийся цветок." },
    { id: "b01", name: "Ромб", cat: "box", n: 4, twist: 0, phase: Math.PI / 4, prof: "cyl", color: "#b8a6e8", h: .42, r: .3, mb: 26, dims: "140 × 140 × 90 мм", print: "сопло 0,4 мм, слой 0,2 мм", desc: "Квадратный бокс с крышкой на посадке." },
    { id: "b02", name: "Плетёнка", cat: "box", n: 4, twist: 0, phase: .35, prof: "cyl", color: "#e7c9a0", h: .44, r: .31, mb: 158, dims: "160 × 120 × 95 мм", print: "сопло 0,4 мм, слой 0,16 мм", isNew: true, desc: "Бокс с фактурой плетёной корзины." },
    { id: "b03", name: "Купол", cat: "box", n: 0, round: true, prof: "bulb", color: "#8fb8de", h: .45, r: .29, mb: 44, dims: "130 × 130 × 100 мм", print: "сопло 0,4 мм, слой 0,2 мм", desc: "Круглая шкатулка с куполообразной крышкой." },
    { id: "b04", name: "Шестигранник", cat: "box", n: 6, twist: 0, phase: 0, prof: "cyl", color: "#4f9e9a", h: .4, r: .3, mb: 33, dims: "140 × 125 × 80 мм", print: "сопло 0,4 мм, слой 0,2 мм", desc: "Шестигранный бокс для мелочей." }
  ];
  let MODELS = BASE_MODELS, byId = {};
  function reindex() { MODELS = state.models; byId = Object.fromEntries(MODELS.map(m => [m.id, m])); }
  const pubCount = () => MODELS.filter(m => !m.hidden && !m.deleted).length;
  const thumb = m => (m.photos && m.photos.length) ? `<img src="${m.photos[0]}" alt="">` : `<canvas data-m="${m.id}"></canvas>`;

  // ---------- pricing ----------
  // Цена за число ОПЛАЧИВАЕМЫХ моделей. 3, 5, 7 — предварительные значения, ждут согласования.
  // Цены живут в state.prices и редактируются в админке.
  const paidPrice = P => { const pr = state.prices; return P <= 0 ? 0 : (P >= 8 ? P * pr.per8 : +pr.paid[P]); };
  const isProv = P => state.prices.prov.includes(P);
  function promoOn() {
    if (state.promoAuto) { const d = new Date(), today = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); return today >= state.promoStart && today <= state.promoEnd; }
    return state.promo;
  }
  function plantQuote(T, promo) {
    if (!T) return { T: 0, P: 0, G: 0, cap: 0, free: 0, price: 0, prov: false };
    const gifts = p => promo ? p : Math.floor(p / 2);
    let P = 1;
    while (P + gifts(P) < T) P++;
    return { T, P, G: T - P, cap: gifts(P), free: P + gifts(P) - T, price: paidPrice(P), prov: isProv(P) };
  }
  function boxPrice(n, promo) {
    const pr = state.prices;
    if (!n) return 0;
    if (promo) return pr.boxPromo * n;
    return n >= 4 ? pr.box4 * n : +pr.box[n];
  }
  function quote() {
    const plants = state.cart.filter(id => byId[id] && byId[id].cat === "plant");
    const boxes = state.cart.filter(id => byId[id] && byId[id].cat === "box");
    const promo = promoOn();
    const pq = plantQuote(plants.length, promo);
    const bp = boxPrice(boxes.length, promo);
    const total = pq.price + bp;
    const list = plants.length * paidPrice(1) + boxes.length * boxPrice(1, false);
    const nextPlant = plantQuote(plants.length + 1, promo).price - pq.price;
    return { plants, boxes, pq, bp, total, save: Math.max(0, list - total), nextPlant, count: state.cart.length };
  }
  window.lolaPricing = { plantQuote, boxPrice };

  // ---------- state ----------
  const KEY = "lola-proto-v2";
  const now = Date.now(), DAY = 864e5;
  function seed() {
    return {
      cart: ["m01", "m03", "m07"], promo: false, promoAuto: false, promoStart: "2026-11-20", promoEnd: "2026-11-30",
      mode: "site", filter: "all", q: "", email: "",
      models: JSON.parse(JSON.stringify(BASE_MODELS)),
      prices: { paid: { 1: 700, 2: 1200, 3: 1600, 4: 2000, 5: 2400, 6: 2800, 7: 3000 }, per8: 400, box: { 1: 900, 2: 1600, 3: 2200 }, box4: 700, boxPromo: 600, prov: [3, 5, 7] },
      orders: [
        { id: "L-1037", date: now - 12 * DAY, items: ["m01", "m11", "m04"], total: 1200, email: "buyer1@example.ru", method: "СБП", ch: "site", sample: true },
        { id: "L-1038", date: now - 9 * DAY, items: ["m02", "m06", "m08", "m12", "m13", "m14"], total: 2000, email: "buyer2@example.ru", tg: "@buyer_tg2", method: "Карта", ch: "tg", sample: true },
        { id: "L-1039", date: now - 7 * DAY, items: ["b02"], total: 900, email: "buyer3@example.ru", method: "СБП", ch: "site", sample: true },
        { id: "L-1040", date: now - 5 * DAY, items: ["m07", "m10", "b01", "b04"], total: 2800, email: "buyer4@example.ru", tg: "@buyer_tg4", method: "СБП", ch: "tg", sample: true },
        { id: "L-1041", date: now - 4 * DAY, items: ["m11"], total: 700, email: "buyer5@example.ru", tg: "@buyer_tg5", method: "Карта", ch: "tg", sample: true },
        { id: "L-1042", date: now - 3 * DAY, items: ["m05", "m09", "m02"], total: 1200, email: "buyer@example.ru", method: "СБП", ch: "site", sample: true, own: true }
      ]
    };
  }
  let state = seed();
  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && Array.isArray(s.cart) && Array.isArray(s.models)) state = Object.assign(seed(), s); } catch (e) {}
  reindex();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  let ui = { paying: false, flash: null, errors: {} };

  // ---------- helpers ----------
  const rub = n => n.toLocaleString("ru-RU") + " ₽";
  function plural(n, f) { const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return f[2]; if (b > 1 && b < 5) return f[1]; if (b === 1) return f[0]; return f[2]; }
  const models = n => n + " " + plural(n, ["модель", "модели", "моделей"]);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const zipMb = m => Math.max(1, Math.round(m.mb * 0.38));
  const fmtDate = t => new Date(t).toLocaleString("ru-RU", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
  const $ = s => document.querySelector(s);
  let toastT;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3200); }

  // ---------- model renderer (layer-by-layer, like a print) ----------
  function hex2rgb(h) { const v = parseInt(h.slice(1), 16); return [v >> 16 & 255, v >> 8 & 255, v & 255]; }
  function shade(rgb, f) { return "rgb(" + rgb.map(c => Math.max(0, Math.min(255, Math.round(f <= 1 ? c * f : c + (255 - c) * (f - 1))))).join(",") + ")"; }
  const PROF = {
    cyl: () => 1,
    cone: t => .72 + .28 * t,
    bulb: t => .62 + .42 * Math.sin(Math.PI * (.12 + .76 * t)),
    bowl: t => .5 + .5 * Math.sqrt(t),
    hour: t => 1 - .28 * Math.sin(Math.PI * t),
    wave: t => .84 + .16 * Math.sin(Math.PI * 3 * t)
  };
  function drawModel(cv, m) {
    if (!cv || !m) return;
    const W = cv.clientWidth || 200, H = cv.clientHeight || W;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const S = Math.min(W, H), cx = W / 2, base = H * .84;
    const height = S * m.h, R = S * m.r, rgb = hex2rgb(m.color);
    const isBox = m.cat === "box";
    const L = Math.max(18, Math.min(64, Math.round(height / 2.6)));
    const lh = height / L;
    const prof = PROF[m.prof] || PROF.cyl;
    // shadow
    ctx.fillStyle = "rgba(0,0,0,.16)";
    ctx.beginPath(); ctx.ellipse(cx, base + lh, R * 1.12, R * .2, 0, 0, Math.PI * 2); ctx.fill();
    let prev = null, last = null;
    for (let i = 0; i < L; i++) {
      const t = i / (L - 1), y = base - i * lh, r = R * prof(t) * (isBox && t > .76 ? 1.03 : 1);
      if (isBox && t > .72 && t < .76) { prev = null; continue; }
      const phi = (m.twist || 0) * t + (m.phase || 0);
      let left = -r, right = r, verts = [];
      if (m.n > 0) {
        for (let k = 0; k < m.n; k++) { const a = phi + 2 * Math.PI * k / m.n; verts.push({ x: r * Math.cos(a), z: Math.sin(a), a }); }
        if (!m.round) { left = Math.min(...verts.map(v => v.x)); right = Math.max(...verts.map(v => v.x)); }
      }
      const alt = i % 2 ? 1 : .955;
      const g = ctx.createLinearGradient(cx + left, 0, cx + right, 0);
      g.addColorStop(0, shade(rgb, .6 * alt)); g.addColorStop(.3, shade(rgb, 1.1 * alt));
      g.addColorStop(.5, shade(rgb, 1 * alt)); g.addColorStop(.85, shade(rgb, .74 * alt)); g.addColorStop(1, shade(rgb, .56 * alt));
      ctx.strokeStyle = g; ctx.lineWidth = lh * .96; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(cx + left, y); ctx.lineTo(cx + right, y); ctx.stroke();
      if (verts.length && prev) {
        ctx.lineWidth = Math.max(.8, lh * .35);
        ctx.strokeStyle = shade(rgb, m.round ? .82 : .68);
        ctx.globalAlpha = m.round ? .45 : .75;
        ctx.beginPath();
        verts.forEach((v, k) => { const p = prev[k]; if (v.z > .05 && p.z > .05) { ctx.moveTo(cx + p.x, y + lh); ctx.lineTo(cx + v.x, y); } });
        ctx.stroke(); ctx.globalAlpha = 1;
      }
      prev = verts; last = { y, r, verts, left, right };
    }
    if (!last) return;
    // top face
    const topY = last.y - lh * .4, k = .17;
    ctx.beginPath();
    if (last.verts.length && !m.round) {
      last.verts.forEach((v, i) => { const px = cx + v.x, py = topY + last.r * Math.sin(v.a) * k; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
      ctx.closePath();
    } else {
      ctx.ellipse(cx, topY, last.r, last.r * k, 0, 0, Math.PI * 2);
    }
    ctx.fillStyle = isBox ? shade(rgb, 1.18) : shade(rgb, .34);
    ctx.fill();
    ctx.lineWidth = 1.4; ctx.strokeStyle = shade(rgb, isBox ? .8 : 1.15); ctx.stroke();
    if (isBox) { // lid knob
      ctx.fillStyle = shade(rgb, .9);
      ctx.beginPath(); ctx.ellipse(cx, topY - 1, last.r * .16, last.r * .05, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  function priceIssues() {

    if (+b.box[2] <= +b.box[1] || +b.box[3] <= +b.box[2] || b.box4 * 4 <= +b.box[3]) out.push("цена боксов не растёт с количеством");

  }

  function stopUpload() { if (ui.upT) clearInterval(ui.upT); ui.upT = null; ui.upload = null; }

    ui.upload = { total, done: 0 };
    const box = () => { const b = $("#upBox"); if (b) b.innerHTML = upBoxHTML(); };
    box();
    ui.upT = setInterval(() => {
      const u = ui.upload; if (!u) return;
      u.done = Math.min(u.total, u.done + Math.max(u.total / 30, .5));
      if (u.done >= u.total) { clearInterval(ui.upT); ui.upT = null; ui.upload = null; d.mb = Math.max(1, Math.round(total)); d.file = f.name; toast("Файл загружен"); }
      box();
    }, 120);
  }
  function addPhotos(files) {
    const d = ui.draft; if (!d || !files || !files.length) return;
    const list = Array.from(files).slice(0, 8);
    let left = list.length, bad = 0;
    const done = () => { if (--left === 0) { render(true); toast(bad ? "Часть файлов не открылась как изображение" : "Фото добавлены"); } };
    list.forEach(f => {
      const url = URL.createObjectURL(f), img = new Image();
      img.onload = () => {
        const s = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        try { d.photos.push(c.toDataURL("image/jpeg", .8)); } catch (er) { bad++; }
        URL.revokeObjectURL(url); done();
      };
      img.onerror = () => { URL.revokeObjectURL(url); bad++; done(); };
      img.src = url;
    });
  }

  // admin events
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-a]"); if (!t) return;
    const a = t.dataset.a;
    if (a === "list") { ui.edit = null; ui.draft = null; ui.confirmDel = false; stopUpload(); if (route() === "admin") { e.preventDefault(); render(); } }
    else if (a === "new") { ui.edit = "new"; ui.err = ""; ui.confirmDel = false; ui.draft = newDraft(); render(); }
    else if (a === "edit") { ui.edit = t.dataset.id; ui.err = ""; ui.confirmDel = false; ui.draft = JSON.parse(JSON.stringify(byId[t.dataset.id])); if (!ui.draft.photos) ui.draft.photos = []; render(); }
    else if (a === "cancel") { ui.edit = null; ui.draft = null; ui.confirmDel = false; stopUpload(); render(); }
    else if (a === "save") saveDraft();
    else if (a === "askdel") { ui.confirmDel = true; render(true); }
    else if (a === "nodel") { ui.confirmDel = false; render(true); }
    else if (a === "del") { const m = byId[ui.edit]; m.deleted = true; m.hidden = true; state.cart = state.cart.filter(id => id !== m.id); ui.edit = null; ui.draft = null; ui.confirmDel = false; save(); render(); toast(`«${m.name}» удалена из каталога`); }
    else if (a === "delphoto") { ui.draft.photos.splice(+t.dataset.i, 1); render(true); }
    else if (a === "resend") { const o = state.orders.find(x => x.id === t.dataset.id); toast(o.ch === "tg" ? `Бот повторно отправил ссылки ${o.tg} в Telegram` : `Ссылки повторно отправлены на ${o.email}`); }
  });
  document.addEventListener("input", e => {
    const t = e.target;
    if (t.id === "aSearch") { ui.aq = t.value; const r = $("#aRows"); if (r) { r.innerHTML = adminRows(); drawAll(r); } return; }
    const f = t.dataset && t.dataset.f; if (!f || !ui.draft) return;
    const d = ui.draft;
    if (f === "visible") d.hidden = !t.checked;
    else if (t.type === "checkbox") d[f] = t.checked;
    else if (f === "n" || f === "twist") { d[f] = parseFloat(t.value) || 0; if (f === "n") { const o = $("#nOut"); if (o) o.textContent = d.n || "гладкое"; } }
    else d[f] = t.value;
    if (f === "cat") { d.h = d.cat === "box" ? .42 : .6; d.r = d.cat === "box" ? .3 : .26; render(true); return; }
    if (["color", "prof", "n", "twist"].includes(f)) drawModel($("#edCanvas"), d);
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.pub) { const m = byId[t.dataset.pub]; m.hidden = !t.checked; save(); render(true); toast(m.hidden ? `«${m.name}» скрыта из каталога` : `«${m.name}» снова в каталоге`); return; }
    if (t.dataset.price) {
      const v = Math.round(Number(t.value));
      if (!Number.isFinite(v) || v <= 0) { toast("Цена должна быть больше нуля"); render(true); return; }
      const [k, sub] = t.dataset.price.split(".");
      if (sub) state.prices[k][sub] = v; else state.prices[k] = v;
      if (k === "paid") state.prices.prov = state.prices.prov.filter(p => p !== +sub);
      save(); render(true); toast("Цена сохранена. Корзина уже считает по ней."); return;
    }
    if (t.hasAttribute("data-promo")) { state.promo = t.checked; save(); render(true); toast(state.promo ? "Акция «1+1» включена" : "Акция выключена, снова действует «2+1»"); return; }
    if (t.hasAttribute("data-pauto")) { state.promoAuto = t.checked; save(); render(true); toast(t.checked ? `Акция включится ${fmtDay(state.promoStart)} и закончится после ${fmtDay(state.promoEnd)}` : "Автовключение по датам отключено"); return; }
    if (t.dataset.pdate) { if (!t.value) return; state[t.dataset.pdate] = t.value; save(); render(true); if (state.promoEnd < state.promoStart) toast("Последний день раньше начала. Проверьте даты."); return; }
    if (t.id === "photoIn") { addPhotos(t.files); return; }
    if (t.id === "stlIn") { startUpload(t.files && t.files[0]); return; }
  });

  render(true);
})();
</script>
</body>
</html>
